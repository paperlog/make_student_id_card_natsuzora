<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏空学園 学生証ジェネレーター</title>
  <style>
    :root {
      --primary-color: #6366f1;
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-color: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 30px 20px;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* 全体レイアウト（フォームとプレビューの横並び） */
    .app-container {
      display: flex;
      flex-direction: row;
      gap: 30px;
      max-width: 1450px;
      width: 100%;
      align-items: flex-start;
    }

    /* ----------------------------------
       入力フォームパネル
    ----------------------------------- */
    .form-panel {
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 380px;
      flex-shrink: 0;
    }

    .form-panel h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      border-left: 4px solid var(--primary-color);
      padding-left: 10px;
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #475569;
    }

    .form-group input[type="text"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .file-input-wrapper {
      position: relative;
    }

    /* ----------------------------------
       プレビューエリア & 学生証カード
    ----------------------------------- */
    .preview-panel {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
    }

    .preview-header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-title {
      font-size: 14px;
      font-weight: bold;
      color: #64748b;
    }

    /* 学生証カード本体（画像を背景に指定） */
    .id-card {
      position: relative;
      width: 900px;
      height: 600px;
      background-image: url('card.png');
      background-size: cover;
      background-position: center;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 1. 学園名 */
    .school-name {
      position: absolute;
      top: 40px;
      left: 170px;
      font-size: 38px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      letter-spacing: 4px;
      white-space: nowrap;
    }

    /* 学園名横のサブテキスト */
    .school-sub {
      position: absolute;
      top: 56px;
      left: 360px;
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
      opacity: 0.65;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* 2. プロフィール写真 */
    .profile-photo {
      position: absolute;
      top: 150px;
      left: 60px;
      width: 310px;
      height: 370px;
      object-fit: cover;
      border-radius: 12px;
      display: none; /* 画像が選ばれるまで非表示（下絵の枠を見せる） */
    }

    /* 3. 各テキストの共通スタイル */
    .field-value {
      position: absolute;
      left: 560px;
      font-size: 24px;
      font-weight: bold;
      color: #2e2640;
      white-space: nowrap;
    }

    /* 各行ごとの高さ（上下位置） */
    .val-name {
      top: 196px;
      font-size: 28px;
    }
    .val-id {
      top: 258px;
      letter-spacing: 2px;
    }
    .val-birthday {
      top: 313px;
    }
    .val-department {
      top: 367px;
    }
    .val-grade {
      top: 461px;
    }
    .val-expiry {
      top: 544px;
      left: 560px;
      font-size: 22px;
      color: #2e2640;
    }

    /* 画面幅が狭い場合（スマホ・タブレット向け） */
    @media (max-width: 1100px) {
      .app-container {
        flex-direction: column;
        align-items: center;
      }
      .form-panel {
        width: 100%;
        max-width: 600px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 入力フォームエリア -->
    <div class="form-panel">
      <h2>学生証 情報入力</h2>

      <div class="form-group">
        <label for="input-photo">証明写真（画像ファイル）</label>
        <input type="file" id="input-photo" accept="image/*">
      </div>

      <div class="form-group">
        <label for="input-school">学園名</label>
        <input type="text" id="input-school" value="夏空学園">
      </div>

      <div class="form-group">
        <label for="input-sub">英字サブテキスト</label>
        <input type="text" id="input-sub" value="STUDENT ID CARD">
      </div>

      <div class="form-group">
        <label for="input-name">氏名</label>
        <input type="text" id="input-name" value="夕波">
      </div>

      <div class="form-group">
        <label for="input-id">学籍番号</label>
        <input type="text" id="input-id" value="73番">
      </div>

      <div class="form-group">
        <label for="input-birthday">生年月日</label>
        <input type="text" id="input-birthday" value="2006年 6月 20日">
      </div>

      <div class="form-group">
        <label for="input-department">所属</label>
        <input type="text" id="input-department" value="普通科">
      </div>

      <div class="form-group">
        <label for="input-grade">学年</label>
        <input type="text" id="input-grade" value="2年生">
      </div>

      <div class="form-group">
        <label for="input-expiry">有効期限</label>
        <input type="text" id="input-expiry" value="夏が来なくなるまで">
      </div>
    </div>

    <!-- プレビューエリア -->
    <div class="preview-panel">
      <div class="preview-header">
        <span class="preview-title">リアルタイムプレビュー</span>
      </div>

      <!-- 学生証カード本体 -->
      <div class="id-card" id="card">
        <div class="school-name" id="disp-school">夏空学園</div>
        <div class="school-sub" id="disp-sub">STUDENT ID CARD</div>

        <!-- 選択した画像がここに反映される -->
        <img class="profile-photo" id="disp-photo" alt="証明写真">

        <div class="field-value val-name" id="disp-name">夕波</div>
        <div class="field-value val-id" id="disp-id">73番</div>
        <div class="field-value val-birthday" id="disp-birthday">2006年 6月 20日</div>
        <div class="field-value val-department" id="disp-department">普通科</div>
        <div class="field-value val-grade" id="disp-grade">2年生</div>
        <div class="field-value val-expiry" id="disp-expiry">夏が来なくなるまで</div>
      </div>
    </div>
  </div>

  <!-- リアルタイム反映用スクリプト -->
  <script>
    // テキスト入力の連動マッピング（フォームID: カード内ID）
    const textFields = {
      'input-school': 'disp-school',
      'input-sub': 'disp-sub',
      'input-name': 'disp-name',
      'input-id': 'disp-id',
      'input-birthday': 'disp-birthday',
      'input-department': 'disp-department',
      'input-grade': 'disp-grade',
      'input-expiry': 'disp-expiry'
    };

    // テキストが打ち込まれるたびにリアルタイム更新
    Object.keys(textFields).forEach(inputId => {
      const inputEl = document.getElementById(inputId);
      const targetEl = document.getElementById(textFields[inputId]);

      inputEl.addEventListener('input', () => {
        targetEl.textContent = inputEl.value;

        // 学園名の文字数に応じて英字の位置を自動調整
        if (inputId === 'input-school') {
          adjustSubPosition();
        }
      });
    });

    // 学園名の長さが変わっても被らないように英字のleft位置を調整
    function adjustSubPosition() {
      const schoolEl = document.getElementById('disp-school');
      const subEl = document.getElementById('disp-sub');
      // 学園名の横幅 + 左マージン + 余白
      const schoolRect = schoolEl.offsetWidth;
      subEl.style.left = (170 + schoolRect + 20) + 'px';
    }
    // 初回実行
    adjustSubPosition();

    // 写真のアップロード処理
    const inputPhoto = document.getElementById('input-photo');
    const dispPhoto = document.getElementById('disp-photo');

    inputPhoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        // 端末内の画像をURL化してプレビュー表示
        dispPhoto.src = URL.createObjectURL(file);
        dispPhoto.style.display = 'block';
      } else {
        dispPhoto.src = '';
        dispPhoto.style.display = 'none';
      }
    });
  </script>
</body>
</html>
